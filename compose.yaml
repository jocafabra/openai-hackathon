services:
  milesai:
    container_name: milesai-demo
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      NEXT_PUBLIC_DEMO_MODE: "true"
    ports:
      - "${MILESAI_PORT:-3107}:3000"
    restart: unless-stopped

